<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Demo Course</title>

  <!-- Engine base styles -->
  <link rel="stylesheet" href="../../engine/styles.css" />

  
</head>

<body>
  <div id="app" class="app">
    <header class="header">
      <div id="courseTitle" class="title"></div>
      <button id="ccToggle" class="btn" aria-pressed="true">CC</button>
    </header>

    <main id="stage" class="stage" tabindex="-1"></main>

    <nav class="nav">
      <button id="prevBtn" class="btn">Prev</button>
      <div class="progress">
        <span id="progressText">0%</span>
        <div class="progressBar">
          <div id="progressFill" class="progressFill"></div>
        </div>
      </div>
      <button id="nextBtn" class="btn">Next</button>
    </nav>

    <footer class="footer">
      <audio id="vo" controls></audio>
    </footer>
  </div>

  <script type="module" src="./main.js">

     </script>
</body>
</html>
