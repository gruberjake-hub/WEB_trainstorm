<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Course Engine v1</title>
  <link rel="stylesheet" href="engine/styles.css" />
</head>
<body>
  <div id="app" class="app" aria-label="Course player">
    <header class="header">
      <div class="title" id="courseTitle">Course</div>
      <div class="controls">
        <button id="ccToggle" class="btn" aria-pressed="true">CC</button>
      </div>
    </header>

    <nav class="nav" aria-label="Course navigation">
      <button id="prevBtn" class="btn">Prev</button>
      <div class="progress" aria-label="Progress">
        <div id="progressText" class="progressText">0%</div>
        <div class="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
          <div id="progressFill" class="progressFill"></div>
        </div>
      </div>
      <button id="nextBtn" class="btn">Next</button>
    </nav>

    <main id="stage" class="stage" tabindex="-1"></main>

    <footer class="footer">
      <audio id="vo" preload="metadata" controls></audio>
      <!-- Captions are handled via <track> inside audio -->
    </footer>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
