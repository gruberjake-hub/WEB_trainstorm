<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- Diagram of record: how the trainstorm-core schemas, vocabularies, registries and stores reference each other.
     Edges are HAND-READ from the files they name and stamped with the commit they were read at (see header).
     They go stale when a schema changes: re-read and bump the stamp. A derived tools/schema_graph.py is named, not built.
     Self-contained on purpose: site CSP is script-src self, style-src self (see /_headers) - no CDN, no web fonts. -->
<title>Trainstorm Core Schema Graph</title>
<style>
  :root {
    --bg: #F1F3F6;
    --surface: #FFFFFF;
    --surface-2: #E8ECF0;
    --ink: #16202B;
    --muted: #5B6B7A;
    --line: #C7D0D9;
    --line-strong: #8C9AA8;
    --atom: #D4571C;
    --element: #0E7C86;
    --facet: #A8780A;
    --warrant: #3C8C4E;
    --ir: #5A6B8C;
    --render: #7A4FB5;
    --expr: #2F6FBF;
    --audience: #B03A6B;
    --vocab: #6B7785;
    --registry: #6B7785;
    --pin: #C2410C;
    --edge-key: #16202B;
    --edge-vocab: #7A4FB5;
    --edge-pin: #C2410C;
    --edge-derived: #5B6B7A;
    --edge-binds: #A8780A;
    --dim: 0.10;
    --shadow: 0 1px 2px rgba(22,32,43,.06), 0 6px 20px rgba(22,32,43,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F151B; --surface: #17202A; --surface-2: #1F2A36;
      --ink: #E6EBF0; --muted: #93A1AF; --line: #2E3A47; --line-strong: #4A5968;
      --atom: #F07A3E; --element: #3BB4BE; --facet: #D9A63A; --warrant: #63B577;
      --ir: #8FA2C8; --render: #A98BE0; --expr: #6FA3EA; --audience: #E07AA6; --vocab: #93A1AF; --registry: #93A1AF;
      --pin: #F0803E; --edge-key: #E6EBF0; --edge-vocab: #A98BE0; --edge-pin: #F0803E;
      --edge-derived: #93A1AF; --edge-binds: #D9A63A; --dim: 0.12;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F151B; --surface: #17202A; --surface-2: #1F2A36;
    --ink: #E6EBF0; --muted: #93A1AF; --line: #2E3A47; --line-strong: #4A5968;
    --atom: #F07A3E; --element: #3BB4BE; --facet: #D9A63A; --warrant: #63B577;
    --ir: #8FA2C8; --render: #A98BE0; --expr: #6FA3EA; --audience: #E07AA6; --vocab: #93A1AF; --registry: #93A1AF;
    --pin: #F0803E; --edge-key: #E6EBF0; --edge-vocab: #A98BE0; --edge-pin: #F0803E;
    --edge-derived: #93A1AF; --edge-binds: #D9A63A; --dim: 0.12;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.45;
    display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden;
  }
  code, .mono { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace; }

  header {
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--surface);
  }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  header .stamp { color: var(--muted); font-size: 12px; }
  header .stamp code { font-size: 11.5px; }
  .toggles { display: flex; gap: 6px 14px; flex-wrap: wrap; margin-left: auto; align-items: center; }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; color: var(--ink); }
  .toggles input { accent-color: var(--ink); margin: 0; }
  .swatch { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--edge-key); }
  .swatch.vocab { border-top: 2px dotted var(--edge-vocab); }
  .swatch.pin { border-top: 2px dashed var(--edge-pin); }
  .swatch.derived { border-top: 2px dashed var(--edge-derived); }
  .swatch.binds { border-top: 3px solid var(--edge-binds); }
  .swatch.proposed { border-top: 1px dashed var(--line-strong); }
  header button {
    font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 4px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); cursor: pointer;
  }
  header button:hover { background: var(--surface-2); }
  header button:focus-visible, .toggles input:focus-visible { outline: 2px solid var(--element); outline-offset: 2px; }

  main { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
  #canvas { position: relative; min-width: 0; overflow: hidden; }
  #canvas svg { width: 100%; height: 100%; display: block; cursor: grab; }
  #canvas svg:active { cursor: grabbing; }
  .hint { position: absolute; left: 14px; bottom: 12px; font-size: 11.5px; color: var(--muted); background: color-mix(in srgb, var(--surface) 82%, transparent); padding: 4px 8px; border-radius: 4px; pointer-events: none; }

  /* graph marks */
  .region rect { fill: none; stroke: var(--line); stroke-dasharray: 3 4; rx: 8; }
  .region text { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; fill: var(--muted); }
  .edge { fill: none; stroke-width: 1.4; transition: opacity .15s; }
  .edge.key { stroke: var(--edge-key); opacity: .38; }
  .edge.vocab { stroke: var(--edge-vocab); stroke-dasharray: 2 4; opacity: .3; }
  .edge.pin { stroke: var(--edge-pin); stroke-dasharray: 7 4; opacity: .7; }
  .edge.derived { stroke: var(--edge-derived); stroke-dasharray: 8 5; opacity: .7; }
  .edge.binds { stroke: var(--edge-binds); stroke-width: 2.4; opacity: .8; }
  .edge.proposed { stroke: var(--line-strong); stroke-dasharray: 2 3; stroke-width: 1; opacity: .5; }
  .edge.self { opacity: .5; }
  svg.focused .edge { opacity: var(--dim); }
  svg.focused .edge.lit { opacity: 1; stroke-width: 2.2; }
  svg.focused .edge.lit.binds { stroke-width: 3; }
  svg.focused .node { opacity: .28; }
  svg.focused .node.lit { opacity: 1; }
  .node { cursor: pointer; transition: opacity .15s; }
  .node rect.box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.2; rx: 5; }
  .node rect.band { rx: 5; }
  .node .name { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; fill: var(--ink); }
  .node .sub { font-size: 10.5px; fill: var(--muted); }
  .node .key { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: var(--muted); }
  .node.chip rect.box { rx: 14; }
  .node.chip .name { font-size: 11px; }
  .node.selected rect.box { stroke-width: 2.4; }
  .node:focus { outline: none; }
  .node:focus-visible rect.box { stroke: var(--element); stroke-width: 2.4; }
  .core rect.box { stroke-width: 2; }
  .g-atom rect.box { stroke: var(--atom); } .g-atom rect.band { fill: var(--atom); }
  .g-element rect.box { stroke: var(--element); } .g-element rect.band { fill: var(--element); }
  .g-facet rect.band { fill: var(--facet); }
  .g-warrant rect.band { fill: var(--warrant); }
  .g-ir rect.band { fill: var(--ir); }
  .g-render rect.band { fill: var(--render); }
  .g-expr rect.band { fill: var(--expr); }
  .g-audience rect.band { fill: var(--audience); }
  .g-vocab rect.band, .g-registry rect.band { fill: var(--vocab); }
  .g-store rect.box { stroke-dasharray: 4 3; }
  marker path { fill: context-stroke; }
  .elabel { pointer-events: none; }
  .elabel rect { fill: var(--surface); stroke: var(--line); stroke-width: .8; rx: 3; }
  .elabel text { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: var(--ink); }

  /* panel */
  aside {
    border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 18px 20px 28px;
  }
  aside h2 { margin: 0 0 2px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  aside h2 code { font-size: 13.5px; }
  aside .file { color: var(--muted); font-size: 11.5px; margin-bottom: 10px; }
  aside .group { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  aside .group i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  aside p { margin: 0 0 12px; max-width: 62ch; }
  aside p.role { font-size: 13.5px; }
  aside p.note { font-size: 12.5px; color: var(--muted); }
  aside h3 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  .conn { display: grid; grid-template-columns: 22px 1fr; gap: 4px 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 12.5px; cursor: pointer; }
  .conn:hover { background: var(--surface-2); margin: 0 -8px; padding: 8px; }
  .conn .arrow { color: var(--muted); font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace; }
  .conn .to { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; }
  .conn .path { grid-column: 2; color: var(--ink); }
  .conn .path code { font-size: 11.5px; background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }
  .conn .meta { grid-column: 2; color: var(--muted); font-size: 11.5px; }
  .tag { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line-strong); color: var(--muted); margin-right: 6px; vertical-align: middle; }
  .tag.key { border-color: var(--edge-key); color: var(--edge-key); }
  .tag.vocab { border-color: var(--edge-vocab); color: var(--edge-vocab); }
  .tag.pin { border-color: var(--edge-pin); color: var(--edge-pin); }
  .tag.binds { border-color: var(--edge-binds); color: var(--edge-binds); }
  .tag.derived { border-color: var(--edge-derived); color: var(--edge-derived); }
  .intro p { max-width: 60ch; }
  .intro .legend { display: grid; grid-template-columns: 28px 1fr; gap: 6px 10px; font-size: 12.5px; margin: 8px 0 14px; align-items: center; }
  .intro .legend span.l { display: inline-block; width: 24px; }
  .intro ul { padding-left: 18px; margin: 0 0 12px; font-size: 12.5px; }
  .intro li { margin-bottom: 4px; }
  .empty { color: var(--muted); font-size: 12.5px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 40vh; } aside { border-left: 0; border-top: 1px solid var(--line); } }
  @media (prefers-reduced-motion: reduce) { .edge, .node { transition: none; } }
</style>

</head>
<body>
<header>
  <div>
    <h1>Trainstorm Core Schema Graph</h1>
    <div class="stamp">Read from <code>cgen/trainstorm-core</code> at <code>main@8b349d9</code> · 2026-09-01 · click a node for its field-level joins</div>
  </div>
  <div class="toggles" id="toggles">
    <label><span class="swatch"></span><input type="checkbox" data-type="key" checked> keyed reference</label>
    <label><span class="swatch binds"></span><input type="checkbox" data-type="binds" checked> binds under</label>
    <label><span class="swatch pin"></span><input type="checkbox" data-type="pin" checked> hash pin</label>
    <label><span class="swatch derived"></span><input type="checkbox" data-type="derived" checked> derived / realized</label>
    <label><span class="swatch vocab"></span><input type="checkbox" data-type="vocab" checked> governed value / mirror</label>
    <label><span class="swatch proposed"></span><input type="checkbox" data-type="proposed"> proposed, not built</label>
    <button id="reset" type="button">Reset view</button>
  </div>
</header>

<main>
  <div id="canvas">
    <svg id="svg" viewBox="0 0 1760 1040" role="img" aria-label="Node graph of how the trainstorm-core schemas, vocabularies, registries and stores reference each other, with the content atom and its occurrence element at the centre.">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
      </defs>
      <g id="view"></g>
    </svg>
    <div class="hint">Scroll to zoom · drag the canvas to pan · drag a node to nudge it · Esc clears selection</div>
  </div>
  <aside id="panel"></aside>
</main>

<script src="/cgen/trainstorm-core/architecture/diagrams/d3.v7.9.0.min.js"></script>
<script>
// ---------- DATA (every edge below was read from the file it names) ----------
const GROUPS = {
  atom:     { label: 'Content canon',        css: 'g-atom',     color: 'var(--atom)' },
  element:  { label: 'Occurrence',           css: 'g-element',  color: 'var(--element)' },
  facet:    { label: 'Source-type facets',   css: 'g-facet',    color: 'var(--facet)' },
  warrant:  { label: 'Warrant chain',        css: 'g-warrant',  color: 'var(--warrant)' },
  ir:       { label: 'Generation IR',        css: 'g-ir',       color: 'var(--ir)' },
  render:   { label: 'Rendering stores',     css: 'g-render',   color: 'var(--render)' },
  expr:     { label: 'Expression path',      css: 'g-expr',     color: 'var(--expr)' },
  audience: { label: 'Sibling graph · audience', css: 'g-audience', color: 'var(--audience)' },
  vocab:    { label: 'Closed vocabulary',    css: 'g-vocab',    color: 'var(--vocab)' },
  registry: { label: 'Registry (keyed lookup)', css: 'g-registry', color: 'var(--registry)' },
};

const NODES = [
  // core
  { id:'atom', name:'atom.schema.json', sub:'Content Atom · the meaning node', key:'atom_', group:'atom', core:true, x:560, y:450, w:250, h:60,
    role:'The meaning node. Owns the only embedded payload (meaning.source_text) and content_hash. Everything else is a keyed binding. atom_id is the only content-node key — locale packs, voice packs, registries and the learner model all join here.',
    note:'Gate: tools/validate_atoms.py. bindings.intent is closed and empty — intent moved to the occurrence (DECISIONS 2026-08-25).' },
  { id:'element', name:'element.schema.json', sub:'Element · one occurrence of an atom', key:'ele_', group:'element', core:true, x:900, y:450, w:250, h:60,
    role:'One placement of an atom in a course. Minted at realization (tools/realize.py), never carries authored meaning. Occurrence-level facets bind here: rhetorical, move, teaches, intended_response, expression keys, narration, render.',
    note:'One atom → many elements. Cartographer writes intent; Couturier writes expression style keys; Realizer mints ids.' },
  // facets
  { id:'procedure', name:'procedure.facet.schema.json', sub:'bindings.procedure · SOP steps', group:'facet', x:380, y:660, w:230, h:52,
    role:'Execution semantics for procedural (SOP) source: step_type, who performs, what records it produces, decision branches. Attached under atom.bindings.procedure. Single-writer: Headwater ingest.' },
  { id:'form', name:'form.facet.schema.json', sub:'bindings.form · a blank template', group:'facet', x:600, y:660, w:230, h:52,
    role:'Models a form TEMPLATE (never a submission): field_type, content_disposition, evidence demand, named slots inside retained text. Single-writer: Headwater (form-specialized). v0.5.' },
  { id:'instance', name:'instance.facet.schema.json', sub:'bindings.instance · authored overlay', group:'facet', x:820, y:660, w:230, h:52,
    role:'Binds an AUTHORED atom to the template slot it fills — a sparse overlay over a pinned template. Single-writer: the ALSAP Lead via Amanuensis; the only writer is tools/accept_value.py.' },
  { id:'socket', name:'socket.schema.json', sub:'Intake contract · derived, never authored', group:'facet', x:600, y:830, w:230, h:52,
    role:'What a stakeholder must supply for a delivered agent to work. tools/project_socket.py walks the template store and emits one demand per unfilled point. Correct the template atom, never this file.' },
  // warrant
  { id:'goal', name:'goal.schema.json', sub:'ontology/goals.json · the warrant', key:'goal_', group:'warrant', x:560, y:110, w:250, h:52,
    role:'The warrant. A goal is what the organisation wants to be different, with a required reachability gate (trainable / not_trainable / assessed_by). Owner: the client\'s business, not L&D.' },
  { id:'objectives', name:'objectives.schema.json', sub:'ontology/objectives.json', key:'obj_', group:'warrant', x:900, y:110, w:250, h:52,
    role:'The governed store of learning objectives. Closed for use: an ungoverned obj_ reference is flagged. Points sideways (requires), outward (framework) and upward (serves → goal). bloom lives here, not on content.',
    note:'Checked by tools/validate_objectives.py (warrant chain, 45/45).' },
  // audience (sibling graph)
  { id:'audience', name:'audience-model.schema.json', sub:'audience/<segment_id>.json · segment record', key:'seg_', group:'audience', x:1230, y:95, w:250, h:52,
    role:'The Audience Agent\'s write schema: one record per SEGMENT (never a person) — standing, disposition factors, four baselines, cadence. The sibling graph beside content; joins it ONLY through objective ids and, downstream, element ids. PII-blind by construction. Also the LRE Stage-1 synthetic learner. lrn_ is reserved for the Responsive Engine and rejected in a content store.',
    note:'Gate: tools/validate_audience.py. Landed 2026-09-01 (PR #62).' },
  // IR
  { id:'primitives', name:'script.primitives.v2.json', sub:'Generation IR · didactic moves', key:'p###', group:'ir', x:390, y:300, w:250, h:52,
    role:'The semantic generation layer: an ordered array of typed knowledge structures (definition, process_flow, knowledge_check …) emitted from source BEFORE presentation. Realized downstream into elements. v2 puts knowledge_check in response-feature form.' },
  // render stores
  { id:'locales', name:'locales/<bcp47>.json', sub:'Locale pack · README contract only', group:'render', x:1230, y:210, w:240, h:52, store:true,
    role:'Externalized translations keyed by atom_id: { target, status, reviewer, source_hash }. Meaning is translated once per atom, not per occurrence. Optional derived_from chains from an accepted voice entry.' },
  { id:'voice', name:'voice.pack.schema.json', sub:'voice/<register>.json', group:'render', x:1230, y:330, w:240, h:52,
    role:'A locale pack shifted in REGISTER instead of language. entries key on atom_id, element_overrides on element_id, beats on beat_id. Two pins per entry: source_hash (the atom) and derived_from (the text worked from).' },
  { id:'narration', name:'narration.pack.schema.json', sub:'voice/narration/<register>.json', group:'render', x:1230, y:450, w:240, h:52,
    role:'Scene-level spoken prose, multi-pinned: sources maps every contributing atom_id → content_hash and every woven bt_ → beat_hash. Dragoman narrate mode writes; Griot binds performance to accepted tracks.' },
  { id:'beats', name:'beats.catalog.schema.json', sub:'occurrences/beats.json · the arc', key:'bt_', group:'render', x:1230, y:570, w:240, h:52,
    role:'Content-free rhetorical/pedagogical moves keyed by PLACEMENT (lesson_start, scene_end, after_element …), not by atom. Dramaturge proposes; the designer accepts. beat_hash = sha256({beat_id, placement, intent}).' },
  { id:'direction', name:'direction.pack.schema.json', sub:'direction/<segment_id>.json · the audience coordinate', group:'render', x:1490, y:760, w:250, h:52,
    role:'The third coordinate of the rendering space: locale packs key a rendering by LANGUAGE, voice packs by REGISTER, direction packs by AUDIENCE SEGMENT. Carries no words and no styles — per element, WEIGHT (what is load-bearing) and TEMPO (how it arrives), plus a reason trace. A pack is the audience DELTA: a binding equal to the audience-blind baseline is not written, because it would read the same for every segment. Written by the Responsive Engine in resolve mode; read by Couturier as an upstream signal.',
    note:'Gate: tools/validate_direction.py. Landed 2026-09-01.' },
  { id:'scenes', name:'occurrences/scenes.json', sub:'Scene catalog · shaped by scene.enum', group:'element', x:1230, y:690, w:240, h:52, store:true,
    role:'Authored project data, source of truth for scene membership: ordered ele_ refs, a governed role, optional in-scene check refs into manifest.checks. Realizer reads it and stamps spine.scenes.' },
  // expression path
  { id:'primreg', name:'vocab/primitives.registry.json', sub:'text · layout · interaction · style keys', group:'expr', x:900, y:850, w:250, h:52,
    role:'The keys element.expression may use. layout_primitive keys equal the layout-engine manifest layout ids (canonical, 2026-07-31). Carries the Realizer\'s closed compiler vocabulary (heading/body/step/callout/check → text_primitive). Status: partial.' },
  { id:'visualasset', name:'visual-asset.schema.json', sub:'visual-assets.registry.json · 255', key:'asset_', group:'expr', x:1230, y:850, w:240, h:52,
    role:'One registry entry: a reference to an image file plus governed metadata (role, mark_class, scope, content_hash). The map, never the bytes. Elements resolve it through render.asset_ref.' },
  { id:'manifest', name:'template_manifest.schema.json', sub:'.potx shell · generated, no intent', group:'expr', x:900, y:970, w:250, h:52,
    role:'Machine-extracted description of a .potx brand shell: theme tokens, per-layout slot geometry, Storyline binding metadata. Pure structure + skin.' },
  { id:'sidecar', name:'intent_sidecar.schema.json', sub:'layout-engine policy · CI-bounded', group:'expr', x:1230, y:970, w:240, h:52,
    role:'Human-authored policy over a manifest: selects a layout_primitive from governed intent signals and binds a scene\'s elements (by element_id) into the layout\'s slots. Bounded by layout-engine/ci/validate_sidecar.py.' },
  // vocab chips (left column)
  { id:'v_intent', name:'intent.enum.json', sub:'rhetorical · pedagogical', group:'vocab', chip:true, x:118, y:150, w:170, h:32, role:'Two orthogonal dimensions: rhetorical (orient, assert, persuade …) and pedagogical (hook, present, practice, assess, reinforce, transfer …). Owner: instructional_design. Closed list; the validator rejects anything else.' },

  { label:'Registries', members:NODES.filter(n=>n.group==='registry').map(n=>n.id) },
];
const regionG = view.append('g').attr('class','regions');
function regionBox(r){
  const ns = r.members.map(id => byId[id]); const pad = 14;
  const x0 = d3.min(ns, n=>n.x-n.w/2)-pad, x1 = d3.max(ns, n=>n.x+n.w/2)+pad;
  const y0 = d3.min(ns, n=>n.y-n.h/2)-pad, y1 = d3.max(ns, n=>n.y+n.h/2)+pad;
  return {x:x0, y:y0, w:x1-x0, h:y1-y0};
}
function drawRegions(){
  regionG.selectAll('g').data(REGIONS).join(enter => {
    const g = enter.append('g').attr('class','region'); g.append('rect'); g.append('text'); return g;
  }).each(function(r){
    const b = regionBox(r), g = d3.select(this);
    g.select('rect').attr('x',b.x).attr('y',b.y).attr('width',b.w).attr('height',b.h);
    g.select('text').attr('x',b.x+2).attr('y',b.y-7).text(r.label);
  });
}
drawRegions();

function edgePath(e) {
  const a = byId[e.s], b = byId[e.t];
  if (a === b) { // self loop, top-right corner
    const x = a.x + a.w/2, y = a.y - a.h/2;
    return `M ${x-28} ${y} C ${x-16} ${y-46}, ${x+44} ${y-46}, ${x+8} ${y+6}`;
  }
  const off = (e.idx - (e.count-1)/2) * 14; // spread parallel edges of one pair
  const dx = b.x - a.x, dy = b.y - a.y;
  let sx, sy, tx, ty;
  if (Math.abs(dx) * a.h > Math.abs(dy) * a.w) { // horizontal exit
    const fy = Math.max(-(a.h/2-12), Math.min(a.h/2-12, dy*0.3));
    const gy = Math.max(-(b.h/2-12), Math.min(b.h/2-12, -dy*0.3));
    sx = a.x + Math.sign(dx) * a.w/2; sy = a.y + off + fy;
    tx = b.x - Math.sign(dx) * b.w/2; ty = b.y + off + gy;
    const c = Math.max(40, Math.abs(tx - sx) * 0.45);
    return `M ${sx} ${sy} C ${sx + Math.sign(dx)*c} ${sy + off}, ${tx - Math.sign(dx)*c} ${ty + off}, ${tx} ${ty}`;
  } else {
    const fx = Math.max(-(a.w/2-18), Math.min(a.w/2-18, dx*0.4));
    const gx = Math.max(-(b.w/2-18), Math.min(b.w/2-18, -dx*0.4));
    sx = a.x + off + fx; sy = a.y + Math.sign(dy) * a.h/2;
    tx = b.x + off + gx; ty = b.y - Math.sign(dy) * b.h/2;
    const c = Math.max(30, Math.abs(ty - sy) * 0.45);
    return `M ${sx} ${sy} C ${sx + off} ${sy + Math.sign(dy)*c}, ${tx + off} ${ty - Math.sign(dy)*c}, ${tx} ${ty}`;
  }
}

// merge parallel edges of the same pair for drawing (one path, several facts)
const pairKey = e => `${e.s}→${e.t}|${e.type}`;
const drawn = {};
EDGES.forEach(e => { (drawn[pairKey(e)] ||= { s:e.s, t:e.t, type:e.type, facts:[] }).facts.push(e); });
const DRAWN = Object.values(drawn);
{ const groups = {}; DRAWN.forEach(d => { const k = [d.s,d.t].sort().join('|'); (groups[k] ||= []).push(d); });
  Object.values(groups).forEach(g => g.forEach((d,i) => { d.idx = i; d.count = g.length; d.fwd = (d.s <= d.t); })); }

const edgeG = view.append('g').attr('class','edges');
const edgeSel = edgeG.selectAll('path').data(DRAWN).join('path')
  .attr('class', d => `edge ${d.type}${d.s===d.t?' self':''}`)
  .attr('marker-end','url(#arr)')
  .attr('d', edgePath);

const nodeG = view.append('g').attr('class','nodes');
const labelG = view.append('g').attr('class','elabels');
const nodeSel = nodeG.selectAll('g').data(NODES).join('g')
  .attr('class', d => `node ${GROUPS[d.group].css}${d.core?' core':''}${d.chip?' chip':''}${d.store?' g-store':''}`)
  .attr('tabindex', 0)
  .attr('role','button')
  .attr('aria-label', d => d.name)
  .attr('transform', d => `translate(${d.x - d.w/2},${d.y - d.h/2})`);

nodeSel.each(function(d){
  const g = d3.select(this);
  g.append('rect').attr('class','box').attr('width', d.w).attr('height', d.h);
  if (!d.chip) g.append('rect').attr('class','band').attr('x',0).attr('y',0).attr('width',6).attr('height',d.h);
  if (d.chip) {
    g.append('rect').attr('class','band').attr('x',10).attr('y',d.h/2-4).attr('width',8).attr('height',8).attr('rx',2);
    g.append('text').attr('class','name').attr('x',24).attr('y',d.h/2+4).text(d.name);
  } else {
    g.append('text').attr('class','name').attr('x',16).attr('y',d.core?24:21).text(d.name);
    g.append('text').attr('class','sub').attr('x',16).attr('y',d.core?43:38).text(d.sub);
    if (d.key) g.append('text').attr('class','key').attr('x',d.w-10).attr('y',d.core?24:21).attr('text-anchor','end').text(d.key);
  }
});

// drag nodes (nudge only)
nodeSel.call(d3.drag()
  .on('drag', function(ev, d){ if (!d._raised) { d3.select(this).raise(); d._raised = true; } d.x += ev.dx; d.y += ev.dy; d3.select(this).attr('transform', `translate(${d.x - d.w/2},${d.y - d.h/2})`); edgeSel.attr('d', edgePath); drawRegions(); if (selected) drawLabels(selected); }));

// ---------- INTERACTION ----------
let selected = null;
const enabled = new Set(['key','binds','pin','derived','vocab']);
function applyFilters(){
  edgeSel.style('display', d => enabled.has(d.type) ? null : 'none');
}
applyFilters();
d3.selectAll('#toggles input').on('change', function(){
  this.checked ? enabled.add(this.dataset.type) : enabled.delete(this.dataset.type);
  applyFilters(); if (selected) focus(selected);
});

function drawLabels(id){
  labelG.selectAll('*').remove();
  if (!id) return;
  edgeSel.filter(d => (d.s===id || d.t===id) && enabled.has(d.type)).each(function(d){
    const L = this.getTotalLength(); let tt = d.count === 1 ? 0.42 : 0.28 + d.idx * (0.44 / (d.count - 1)); if (!d.fwd) tt = 1 - tt;
    const p = this.getPointAtLength(L * (d.s===d.t ? 0.5 : tt));
    const txt = d.facts.map(f => f.label).join(' · ');
    const g = labelG.append('g').attr('class','elabel').attr('transform', `translate(${p.x},${d.s===d.t ? p.y-10 : p.y})`);
    const t = g.append('text').attr('x',0).attr('y',3.5).attr('text-anchor','middle').text(txt);
    const w = t.node().getComputedTextLength() + 10;
    g.insert('rect','text').attr('x',-w/2).attr('y',-8).attr('width',w).attr('height',16);
  });
}
function focus(id){
  svg.classed('focused', true);
  const lit = new Set([id]);
  edgeSel.classed('lit', d => { const on = (d.s===id || d.t===id) && enabled.has(d.type); if (on){ lit.add(d.s); lit.add(d.t);} return on; });
  nodeSel.classed('lit', d => lit.has(d.id)).classed('selected', d => d.id===id);
  drawLabels(id);
}
function unfocus(){ svg.classed('focused', false); drawLabels(null); edgeSel.classed('lit', false); nodeSel.classed('lit', false).classed('selected', false); }

nodeSel.on('mouseenter', (ev,d) => { if (!selected) focus(d.id); })
  .on('mouseleave', () => { if (!selected) unfocus(); })
  .on('click', (ev,d) => { ev.stopPropagation(); select(d.id); })
  .on('keydown', (ev,d) => { if (ev.key==='Enter' || ev.key===' ') { ev.preventDefault(); select(d.id); } });
svg.on('click', () => { selected = null; unfocus(); renderIntro(); });
document.addEventListener('keydown', ev => { if (ev.key==='Escape') { selected=null; unfocus(); renderIntro(); } });
d3.select('#reset').on('click', () => { svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity); });

function select(id){ selected = id; focus(id); renderPanel(id); }

const panel = document.getElementById('panel');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function renderIntro(){
  const counts = {};
  EDGES.forEach(e => counts[e.type] = (counts[e.type]||0)+1);
  panel.innerHTML = `
    <div class="intro">
      <h2>How the pieces join</h2>
      <p class="role">${NODES.length} nodes, ${EDGES.length} field-level connections, read from the schemas, vocabularies and registries in <code>cgen/trainstorm-core</code> (plus the three store contracts that live in READMEs and vocab files: locale packs, scenes, and the client-tier registries).</p>
      <p>The shape to hold: <strong>everything joins on <code>atom_id</code></strong>. The atom owns meaning and <code>content_hash</code>; an element is one occurrence of it (<code>composed_from</code>); facets hang <em>under</em> the atom; every rendering store (locale, voice, narration) keys back to the atom and pins its hash; the warrant chain sits above and is reached only through <code>teaches[]</code>; the audience model is a <em>sibling</em> graph that joins content only through objectives and segment ids.</p>
      <h3>Edge types</h3>
      <div class="legend">
        <span class="swatch"></span><span><strong>keyed reference</strong> — an id in one file resolves in another (${counts.key})</span>
        <span class="swatch binds"></span><span><strong>binds under</strong> — a facet schema attaches under <code>atom.bindings.*</code> (${counts.binds})</span>
        <span class="swatch pin"></span><span><strong>hash pin</strong> — a <code>source_hash</code> / <code>sha256</code> that goes stale when its source moves (${counts.pin})</span>
        <span class="swatch derived"></span><span><strong>derived / realized</strong> — a tool produces one from the other (${counts.derived})</span>
        <span class="swatch vocab"></span><span><strong>governed value / mirror</strong> — a field's values are a closed list owned elsewhere (${counts.vocab})</span>
        <span class="swatch proposed"></span><span><strong>proposed, not built</strong> — declared in a vocab or README, absent from the schema (${counts.proposed}; off by default)</span>
      </div>
      <h3>Reading tips</h3>
      <ul>
        <li>Hover a node to see only its connections; click to pin it and list every join with the exact field path.</li>
        <li>Dashed boxes are <em>stores</em> whose contract lives in a README or a vocab file rather than a <code>*.schema.json</code>.</li>
        <li>Grey chips on the left are closed lists; on the right, keyed lookups. Both are single-writer and version-bumped, never silently extended.</li>
      </ul>
      <h3>What drifted (worth knowing)</h3>
      <ul>
        <li><code>atom.schema.json</code> still carries <code>$id: https://astellas.example/…/content-atom.schema.json</code>; every other schema is under <code>trainstorm.ai</code>.</li>
        <li>Three vocabularies (tone, complexity, visual-type) name fields on <code>element</code> that the element schema does not yet declare.</li>
        <li><code>locales/</code> has a README contract but no <code>locale.pack.schema.json</code>, while its sibling voice pack has one.</li>
        <li><code>docs.registry</code> and <code>options.registry</code> exist only at the client tier (<code>cgen/astellas</code>, <code>cgen/brunswick</code>); core has no seed for <code>doc_</code> / <code>reg_</code>.</li>
      </ul>
    </div>`;
}

function renderPanel(id){
  const n = byId[id];
  const out = EDGES.filter(e => e.s===id && e.t!==id);
  const inn = EDGES.filter(e => e.t===id && e.s!==id);
  const self = EDGES.filter(e => e.s===id && e.t===id);
  const row = (e, other, arrow) => `
    <div class="conn" data-go="${other}">
      <span class="arrow">${arrow}</span><span class="to">${esc(byId[other].name)}</span>
      <span class="path"><span class="tag ${e.type}">${e.type==='vocab'?'governed':e.type}</span>${esc(e.path)}</span>
      ${e.meta ? `<span class="meta">${esc(e.meta)}</span>` : ''}
    </div>`;
  panel.innerHTML = `
    <h2><code>${esc(n.name)}</code></h2>
    <div class="file">${esc(n.sub)}${n.key ? ` · id prefix <code>${esc(n.key)}</code>` : ''}</div>
    <div class="group"><i style="background:${GROUPS[n.group].color}"></i>${GROUPS[n.group].label}</div>
    <p class="role">${esc(n.role)}</p>
    ${n.note ? `<p class="note">${esc(n.note)}</p>` : ''}
    ${self.length ? `<h3>Refers to itself</h3>${self.map(e => row(e, id, '↻')).join('')}` : ''}
    <h3>Points to (${out.length})</h3>
    ${out.length ? out.map(e => row(e, e.t, '→')).join('') : '<div class="empty">Nothing — a leaf.</div>'}
    <h3>Pointed at by (${inn.length})</h3>
    ${inn.length ? inn.map(e => row(e, e.s, '←')).join('') : '<div class="empty">Nothing references this node.</div>'}
  `;
  panel.querySelectorAll('.conn').forEach(el => el.addEventListener('click', () => select(el.dataset.go)));
  panel.scrollTop = 0;
}
renderIntro();
</script>
</body>
</html>
