<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AMLT Simulation Runtime (Beta)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>AMLT Simulation Runtime (Beta)</h1>

  <section class="card">
    <h2>Scenario</h2>
    <p><b>Asset:</b> AST-789 (Immuno-Oncology), Phase 1 → Phase 2</p>
    <p><b>Tension:</b> Differentiate via combo vs protect safety/timeline.</p>
  </section>

  <section class="card">
    <h2>Learner Decision Payload</h2>
    <label>Decision Category</label>
    <select id="decision_category">
      <option>STRATEGIC_DIRECTION</option>
      <option>RISK_TOLERANCE</option>
      <option>RESOURCE_ALLOCATION</option>
      <option>PORTFOLIO_POSITIONING</option>
      <option>EVIDENCE_THRESHOLD</option>
      <option>STAKEHOLDER_ALIGNMENT</option>
    </select>

    <label>Stance</label>
    <select id="learner_stance">
      <option>BALANCED</option>
      <option>CONSERVATIVE</option>
      <option>AGGRESSIVE</option>
    </select>

    <label>Rationale (2–5 sentences)</label>
    <textarea id="rationale" rows="5"></textarea>

    <label>Risks Accepted (1–2)</label>
    <input id="risks_accepted" placeholder="e.g., SAFETY, COMPETITIVE" />

    <label>Mitigations (at least one)</label>
    <input id="mitigations" placeholder="e.g., cytokine gating thresholds + interim safety review" />

    <button id="runBtn">Run Simulation</button>
    <div id="status"></div>
  </section>

  <section class="card">
    <h2>Output</h2>
    <pre id="narrative"></pre>
  </section>

  <section class="card">
    <h2>Governance JSON</h2>
    <pre id="govjson"></pre>
  </section>

  <script src="scorm.js"></script>
  <script src="app.js"></script>
</body>
</html>
